# Blueprint de Render: un solo servicio Docker sirve la SPA y la API.
# https://render.com/deploy?repo=https://github.com/antonpayno/megan-grok
services:
  - type: web
    name: pixel-pattern
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHONUNBUFFERED
        value: "1"

