[project]
name = "megan-grok"
version = "0.1.0"
description = "Chat de terminal para Grok (xAI)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.60",
    "python-dotenv>=1.0",
]

[project.scripts]
megan-grok = "megan_grok.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/megan_grok"]

[tool.pytest.ini_options]
testpaths = ["tests"]
